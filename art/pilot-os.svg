<!-- Master of the Pilot OS icon (res/drawable/ic_launcher_*.xml), cropped to the
     72dp an adaptive icon shows: the 512px Play Store icon is rendered from it.
     A P whose bowl is a ring around a pilot light. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 18 72 72">
  <defs>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="18" y1="18" x2="90" y2="90">
      <stop offset="0" stop-color="#262b40"/><stop offset="1" stop-color="#0e1018"/>
    </linearGradient>
    <linearGradient id="mark" gradientUnits="userSpaceOnUse" x1="36" y1="31" x2="72" y2="78">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c9d1e6"/>
    </linearGradient>
    <radialGradient id="light" gradientUnits="userSpaceOnUse" cx="52.5" cy="48.5" r="6">
      <stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#ff7a3d"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="108" height="108" fill="url(#bg)"/>
  <path d="M41,72V38M54,37a13,13 0 1 1 0,26a13,13 0 1 1 0,-26z"
        fill="none" stroke="url(#mark)" stroke-width="7.5" stroke-linecap="round"/>
  <circle cx="54" cy="50" r="4.25" fill="url(#light)"/>
</svg>
